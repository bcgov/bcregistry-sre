# Shared gitleaks rules for bcregistry repos (Git Hooks RFC, bcgov/entity#34619).
#
# Repos pull this file in with lefthook "remotes" and extend it from their own
# .gitleaks.toml - see git-hooks/README.md. Changes here reach every repo that
# uses it within a day, so keep them reviewed and covered by git-hooks/tests/.

[extend]
# Required: without this no default rules load and every scan silently passes.
useDefault = true

[allowlist]
description = "Lockfiles and documentation placeholders, not real secrets"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)poetry\.lock$''',
  # Vendored / minified third-party JS
  '''\.min\.js$''',
]
stopwords = [
  "YOUR_API_KEY",
  "YOUR_ACCESS_TOKEN",
  "YOUR_CLIENT_SECRET",
]

# --- Quoted literal passwords (from bcregistry-sre's own config) ---
[[rules]]
id = "hardcoded-password"
description = "Possible hardcoded password"
regex = '''(?i)[\w.-]*(?:pass(?:word|wd)?|pwd)\s*[:=]\s*["']([^"'\s${}<>]{6,60})["']'''
keywords = ["password", "passwd", "pwd"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  # Obvious placeholder markers, allowed anywhere in the value.
  '''(?i)["'][^"']*(?:change[_-]?me|placeholder|example|redacted|sample|dummy|fake|not[_-]?real|todo|xxx+|\*{3,}|\.{3,})[^"']*["']''',
  # Generic words that are only placeholders when they are the whole value.
  '''(?i)["'](?:test(?:ing)?|none|null|true|false|unset|secret|password|pwd|value|string)["']''',
  '''(?i)(?:os\.environ|getenv|process\.env|vault|secret_manager)''',
  # Throwaway credentials for ephemeral CI service containers.
  '''(?i)["'](?:postgres|mysql|root|admin|guest)["']''',
]

# --- Password assignments incl. unquoted values, e.g. YAML / .env (from bcgov/ppr) ---
[[rules]]
    id = "custom-password"
    description = "Hardcoded password assignment detected"
    regex = '''(?i)(?:password|passwd|pwd)[ \t'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|, )[\x60'" \t=]{0,5}(['"][^'"\s]{8,}['"]|[^\s'"]{8,})'''
    entropy = 2.5
    keywords = ["password", "passwd", "pwd"]
    [[rules.allowlists]]
    description = "References, not literal values (env/config lookups, attributes, CONSTANT names)"
    regexes = [
      '''^(?:os\.(?:getenv|environ)|process\.env|config\.|settings\.|self\.|current_app\.|getattr\()''',
      '''^[A-Z][A-Z0-9_]*[,)]?$''',
      # Any dotted attribute, call or index is a reference, not a value (only reachable for unquoted values)
      '''^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+''',
      '''^[A-Za-z_][A-Za-z0-9_.]*[\(\[]''',
      # Templates / placeholders / selectors: [PASSWORD], <password>, {{password}}, ${VAR}, #password
      '''^[\[<{$#%(]''',
      # 1Password secret references (op://vault/item/field) point to the vault, they aren't the secret
      '''^["']?op://''',
      # Type names / keywords after `password:` or `password ===` (TS/Python annotations, comparisons)
      '''(?i)^(?:undefined|null|none|nil|str|string|bool|boolean|int|number|any|object|function|lambda)\b''',
    ]
    [[rules.allowlists]]
    # Same placeholder word lists as hardcoded-password above, but checked against
    # the captured value: this rule can match values with no surrounding quotes.
    description = "Placeholders and throwaway CI credentials, not real secrets"
    regexes = [
      '''(?i)(?:change[_-]?me|placeholder|example|redacted|sample|dummy|fake|not[_-]?real|todo|xxx+|\*{3,}|\.{3,})''',
      '''(?i)^["']?(?:test(?:ing)?|none|null|true|false|unset|secret|password|pwd|value|string)["']?$''',
      '''(?i)^["']?(?:postgres|mysql|root|admin|guest)["']?$''',
    ]
    [[rules.allowlists]]
    # `, ` counts as an assignment in this rule, so argument lists and destructuring
    # like f(user, password, port) or { username, password, loginType } would match.
    # Only skip when an unquoted name follows the comma; ('password', 'value') still matches.
    description = "Argument lists, not assignments"
    regexTarget = "match"
    regexes = [
      '''(?i)(?:password|passwd|pwd)[ \t'"]*, [A-Za-z_]''',
    ]
